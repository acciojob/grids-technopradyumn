
<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container" style="width: 600px; max-width: 100%; background-color: rgb(41, 0, 0); border: 5px solid rgb(4, 255, 4);">
        <div class="row" style="height: 200px; border: 5px solid rgb(255, 188, 188);">
            <div class="col-6 col-md-4" style="border: 2px dotted rgb(38, 38, 43); background-color: teal;">Column 1</div>
            <div class="col-6 col-md-8" style="border: 2px dotted rgb(38, 38, 43); background-color: thistle;">Column 2</div>
        </div>

        <div class="row" style="height: 200px; border: 5px solid rgb(255, 188, 188);">
            <div class="col-md-4 offset-md-2" style="border: 2px dotted rgb(38, 38, 43); background-color: tomato;">Column 1</div>
            <div class="col-md-4" style="border: 2px dotted rgb(38, 38, 43); background-color: turquoise;">Column 2</div>
        </div>

        <div class="row justify-content-center" style="height: 200px; border: 5px solid rgb(255, 188, 188);">
            <div class="col-6 col-md-4" style="border: 2px dotted rgb(38, 38, 43); background-color: violet;">Column 1</div>
            <div class="col-6 col-md-4" style="border: 2px dotted rgb(38, 38, 43); background-color: yellowgreen;">Column 2</div>
        </div>
    </div>

    <script type="text/javascript" src="./script.js"></script>
</body>
</html>
